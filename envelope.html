<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Yoliya — Invitation</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;1,400&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=Noto+Serif+SC:wght@200;300;400&family=Great+Vibes&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
  background:#fafaf7;
  display:flex;align-items:center;justify-content:center;
  min-height:100vh;overflow:hidden;
  font-family:'Cormorant Garamond','Playfair Display','Noto Serif SC',serif;
  -webkit-font-smoothing:antialiased;
}
.bg-glow{
  position:fixed;inset:0;pointer-events:none;
  background:
    radial-gradient(ellipse at 50% 35%, rgba(210,180,170,0.18) 0%, transparent 55%),
    radial-gradient(ellipse at 30% 70%, rgba(200,175,165,0.10) 0%, transparent 45%);
}

/* ====== 场景 ====== */
.scene{
  position:relative;width:460px;height:540px;
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;
}

/* ====== 信封（长方形） ====== */
.envelope{
  position:relative;width:400px;height:260px;
  transition:transform .4s ease;
}
.envelope:hover{transform:translateY(-3px)}

/* 主体 */
.env-body{
  position:absolute;inset:0;
  background:linear-gradient(175deg, #ead5d8 0%, #e2c8cc 25%, #dbbcc1 60%, #d4b3b8 100%);
  border-radius:4px;
  box-shadow:0 20px 56px rgba(160,130,140,0.22), 0 4px 12px rgba(0,0,0,0.05), inset 0 1px 0 rgba(255,255,255,0.22);
}
.env-body::before{
  content:'';position:absolute;inset:0;
  background-image:
    repeating-linear-gradient(0deg, transparent, transparent 3px, rgba(0,0,0,0.012) 3px, rgba(0,0,0,0.012) 3.5px),
    repeating-linear-gradient(90deg, transparent, transparent 6px, rgba(0,0,0,0.006) 6px, rgba(0,0,0,0.006) 6.5px);
  opacity:0.6;
}
.env-body::after{
  content:'';position:absolute;inset:0;
  background:linear-gradient(180deg, rgba(255,255,255,0.14) 0%, transparent 40%),
             linear-gradient(0deg, rgba(0,0,0,0.02) 0%, transparent 35%);
}
.env-inner-border{
  position:absolute;inset:14px;border:1.5px solid rgba(255,255,255,0.4);border-radius:2px;z-index:1;
}
.env-inner-dash{
  position:absolute;inset:19px;border:1px dashed rgba(255,255,255,0.18);border-radius:1px;z-index:1;
}

/* ====== 缎带蝴蝶结 ====== */
.ribbon-group{
  position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
  z-index:20;pointer-events:none;
  transition:transform .5s ease, opacity .4s ease;
}
.ribbon-group.open{transform:translate(-50%,-50%) scale(.82);opacity:.65}

.ribbon-h{
  position:absolute;top:50%;left:-38px;right:-38px;height:16px;
  transform:translateY(-50%);
  background:linear-gradient(180deg, #e8dbb0 0%, #ddce98 30%, #d4c380 50%, #cdbc72 70%, #d4c380 100%);
  border-radius:2px;
  box-shadow:0 2px 8px rgba(160,140,90,0.18), inset 0 1px 0 rgba(255,255,255,0.4);
}
.bow{
  display:flex;align-items:center;justify-content:center;
  transition:transform .6s cubic-bezier(.34,1.56,.64,1);
}
.bow-loosen{transform:scale(1.04) rotate(2deg)}
.bow-l{
  width:36px;height:26px;
  background:linear-gradient(135deg, #e8dbb0 0%, #ddce98 40%, #d4c380 100%);
  border-radius:50% 10% 50% 50%;transform:rotate(18deg) translateX(6px);
  box-shadow:0 2px 8px rgba(160,140,90,0.22), inset 0 1px 0 rgba(255,255,255,0.4);
}
.bow-c{
  width:20px;height:16px;
  background:linear-gradient(180deg, #f0e8c8 0%, #d4c380 50%, #c4b060 100%);
  border-radius:50%;z-index:2;
  box-shadow:0 2px 6px rgba(140,120,70,0.28), inset 0 1px 0 rgba(255,255,255,0.5);
  margin:0 -3px;
}
.bow-r{
  width:36px;height:26px;
  background:linear-gradient(225deg, #e8dbb0 0%, #ddce98 40%, #d4c380 100%);
  border-radius:10% 50% 50% 50%;transform:rotate(-18deg) translateX(-6px);
  box-shadow:0 2px 8px rgba(160,140,90,0.22), inset 0 1px 0 rgba(255,255,255,0.4);
}
.bow-tails{display:flex;gap:3px;justify-content:center;margin-top:-1px}
.bow-tail{
  width:10px;height:22px;
  background:linear-gradient(180deg, #d4c380 0%, #d8ca8e 40%, #c4b060 100%);
  border-radius:0 0 4px 4px;
  box-shadow:inset 0 1px 0 rgba(255,255,255,0.3);
}
.bow-tail:first-child{transform:rotate(5deg)}
.bow-tail:last-child{transform:rotate(-5deg)}

/* ====== 三角封盖（打开后到信纸后面） ====== */
.env-flap{
  position:absolute;top:0;left:0;right:0;z-index:8;
  height:50%;
  background:linear-gradient(180deg, #f2e0e4 0%, #ead5d8 50%, #e2c8cc 100%);
  clip-path:polygon(0 0, 100% 0, 50% 100%);
  border-radius:4px 4px 0 0;
  box-shadow:0 2px 6px rgba(0,0,0,0.03);
  transform-origin:bottom center;
  transition:transform 1.1s cubic-bezier(.42,0,.58,1);
}
.env-flap.open{transform:rotateX(-178deg)}
.flap-edge{
  position:absolute;bottom:0;left:0;right:0;height:1px;background:rgba(180,150,155,0.25);
}
.flap-tip{
  position:absolute;bottom:-5px;left:50%;transform:translateX(-50%);
  width:0;height:0;
  border-left:7px solid transparent;border-right:7px solid transparent;
  border-top:9px solid rgba(210,180,185,0.45);
}

/* ====== 信纸（z-index 高于封盖，打开后在最上面） ====== */
.letter{
  position:absolute;left:10px;right:10px;z-index:30;
  background:linear-gradient(175deg, #fdfaf4 0%, #faf5ec 50%, #f7f0e4 100%);
  box-shadow:0 10px 40px rgba(0,0,0,0.10), 0 2px 6px rgba(0,0,0,0.04);
  padding:34px 30px 28px;
  transition:transform 1.1s cubic-bezier(.34,1,.64,1), opacity .5s ease;
  /* 毛边 */
  clip-path:polygon(
    1% 0%, 4% .4%, 8% 0%, 12% .6%, 17% .1%, 23% .5%, 28% 0%, 33% .3%,
    38% .1%, 43% .6%, 48% .2%, 53% 0%, 58% .4%, 63% .1%, 68% .5%,
    73% 0%, 78% .3%, 82% .1%, 87% .6%, 91% 0%, 95% .4%, 98% 0%,
    100% 1%, 99% 96%, 100% 98%, 97% 99.5%, 93% 100%, 88% 98.5%,
    83% 99.8%, 78% 99.2%, 73% 100%, 68% 98.6%, 63% 99.4%, 58% 100%,
    53% 98.8%, 48% 99.6%, 43% 100%, 38% 98.4%, 33% 99.5%, 28% 100%,
    23% 98.2%, 18% 99.6%, 13% 100%, 8% 98.8%, 3% 99.4%, 0% 98%
  );
}
.letter::before{
  content:'';position:absolute;inset:-1.5px;
  border:1.5px solid rgba(200,180,160,0.12);
  clip-path:inherit;filter:blur(0.8px);
}

/* 法式花纹 — 四角鸢尾花 */
.letter-ornaments{position:absolute;inset:0;pointer-events:none;overflow:hidden;border-radius:2px}
.letter-ornaments .fl-d{position:absolute;font-size:42px;opacity:.025;color:#b8956a}
.letter-ornaments .fl-d.tl{top:8px;left:10px;transform:rotate(-20deg)}
.letter-ornaments .fl-d.tr{top:8px;right:10px;transform:rotate(20deg) scaleX(-1)}
.letter-ornaments .fl-d.bl{bottom:8px;left:10px;transform:rotate(20deg) scaleY(-1)}
.letter-ornaments .fl-d.br{bottom:8px;right:10px;transform:rotate(-20deg) scale(-1,-1)}

/* 边框花纹 */
.letter-frame{
  position:absolute;inset:14px;border:1px solid rgba(180,150,120,0.12);border-radius:1px;
  pointer-events:none;
}
.letter-frame::before{
  content:'';position:absolute;inset:4px;border:0.5px solid rgba(180,150,120,0.06);
}

/* 信纸内容 */
.letter-content{
  position:relative;z-index:1;
  display:flex;flex-direction:column;
  align-items:center;text-align:center;
  gap:4px;
}

/* === Yoliya 标题 — 法式高级 === */
.letter-title{
  font-family:'Playfair Display','Cormorant Garamond',serif;
  font-size:46px;font-weight:400;font-style:italic;
  color:#b8956a;
  line-height:1;
  letter-spacing:.08em;
  text-shadow:0 1px 3px rgba(180,140,100,0.10);
}

/* 装饰分隔 */
.letter-ornament-line{
  display:flex;align-items:center;gap:10px;
}
.letter-ornament-line span{font-size:10px;opacity:.2;color:#b8956a}
.letter-ornament-line .l1,.letter-ornament-line .l2{
  width:30px;height:0.5px;
}
.letter-ornament-line .l1{background:linear-gradient(90deg, transparent, #c8b090)}
.letter-ornament-line .l2{background:linear-gradient(90deg, #c8b090, transparent)}

.letter-divider{
  width:48px;height:0.5px;
  margin:6px auto;
  background:linear-gradient(90deg, transparent, #c8b090 30%, #c8b090 70%, transparent);
}

/* To: */
.letter-to{
  font-family:'Cormorant Garamond','Playfair Display',serif;
  font-size:15px;color:#b09880;
  font-weight:300;letter-spacing:.14em;font-style:italic;
}
.letter-to input{
  border:none;border-bottom:1px solid #e0d5c8;background:transparent;
  font-family:'Noto Serif SC',serif;font-size:14px;color:#8B7355;font-weight:300;
  width:120px;text-align:center;outline:none;padding:1px 0;
}

/* 祝福语 */
.letter-message{
  font-family:'Noto Serif SC','Cormorant Garamond',serif;
  font-size:15px;color:#8B7355;
  font-weight:300;line-height:2;letter-spacing:.05em;
  padding:8px 12px;max-width:280px;
}

/* 右下角落款 */
.letter-footer{
  display:flex;flex-direction:column;align-items:flex-end;
  width:100%;padding-right:4px;margin-top:10px;
}
.letter-brand{
  font-family:'Cormorant Garamond','Playfair Display',serif;
  font-size:15px;color:#b8956a;
  font-weight:400;letter-spacing:.12em;font-style:italic;
}
.letter-brand input{
  border:none;border-bottom:1px solid #e0d5c8;background:transparent;
  font-family:'Cormorant Garamond','Playfair Display',serif;
  font-size:15px;color:#b8956a;font-weight:400;font-style:italic;
  letter-spacing:.12em;width:140px;outline:none;padding:1px 0;
}
.letter-date{
  font-family:'Cormorant Garamond',serif;
  font-size:11px;color:#c8b098;
  font-weight:300;letter-spacing:.2em;margin-top:2px;
}
.letter-date input{
  border:none;border-bottom:1px solid #e8ddd0;background:transparent;
  font-family:'Cormorant Garamond',serif;
  font-size:11px;color:#c8b098;font-weight:300;
  letter-spacing:.18em;width:100px;outline:none;padding:1px 0;
}

/* 信纸 z-index 高于封盖 — 闭合时在信封内部 */
.letter.closed{transform:translateY(0);opacity:0}
.letter.opened{transform:translateY(-265px);opacity:1}

/* 底部提示 */
.hint{
  position:absolute;bottom:-38px;left:50%;transform:translateX(-50%);
  font-family:'Cormorant Garamond',serif;
  font-size:11px;color:#c8b8b0;letter-spacing:.22em;
  white-space:nowrap;
  animation:hintPulse 2.8s ease-in-out infinite;
  pointer-events:none;
}
@keyframes hintPulse{0%,100%{opacity:.35}50%{opacity:.85}}

/* 金粉 */
.spark{
  position:fixed;pointer-events:none;
  border-radius:50%;
  background:#e8d5a0;
  animation:sparkFly 1.2s ease-out forwards;
}
@keyframes sparkFly{
  0%{opacity:1;transform:translate(0,0) scale(1)}
  100%{opacity:0;transform:translate(var(--dx), var(--dy)) scale(0)}
}
</style>
</head>
<body>

<div class="bg-glow"></div>

<div class="scene" id="scene">

  <div class="envelope" id="envelope">
    <!-- 主体 -->
    <div class="env-body">
      <div class="env-inner-border"></div>
      <div class="env-inner-dash"></div>
    </div>

    <!-- 缎带 + 蝴蝶结 -->
    <div class="ribbon-group" id="ribbon">
      <div class="ribbon-h"></div>
      <div class="bow" id="bow">
        <div class="bow-l"></div>
        <div class="bow-c"></div>
        <div class="bow-r"></div>
      </div>
      <div class="bow-tails">
        <div class="bow-tail"></div>
        <div class="bow-tail"></div>
      </div>
    </div>

    <!-- 封盖（z-index:8，低于信纸的 z-index:12） -->
    <div class="env-flap" id="flap">
      <div class="flap-edge"></div>
      <div class="flap-tip"></div>
    </div>

    <!-- 信纸（z-index:12，高于封盖） -->
    <div class="letter closed" id="letter">
      <!-- 法式花纹 -->
      <div class="letter-ornaments">
        <span class="fl-d tl">&#9884;</span>
        <span class="fl-d tr">&#9884;</span>
        <span class="fl-d bl">&#9884;</span>
        <span class="fl-d br">&#9884;</span>
      </div>
      <div class="letter-frame"></div>

      <div class="letter-content">

        <div class="letter-ornament-line">
          <span class="l1"></span><span>✦</span><span class="l2"></span>
        </div>

        <!-- ★ Yoliya 标题 -->
        <div class="letter-title">Yoliya</div>

        <div class="letter-divider"></div>

        <!-- ★ To: 可编辑 -->
        <div class="letter-to">
          To&nbsp;<input type="text" value="挚爱的你" id="toInput" onclick="event.stopPropagation()">
        </div>

        <!-- ★ 祝福语 -->
        <div class="letter-message" id="messageDisplay">
          愿你的每一天都如阳光般灿烂，<br>
          勇敢追梦，活成自己想要的模样。<br>
          无论何时何地，记得我们永远在你身边。
        </div>

        <!-- ★ 落款 -->
        <div class="letter-footer">
          <span class="letter-brand"><input type="text" value="Yoliya 珠宝" id="brandInput" onclick="event.stopPropagation()"></span>
          <span class="letter-date"><input type="text" value="2026.07.08" id="dateInput" onclick="event.stopPropagation()"></span>
        </div>

        <div class="letter-ornament-line" style="margin-top:4px">
          <span class="l1"></span><span>✧</span><span class="l2"></span>
        </div>

      </div>
    </div>

  </div>

  <div class="hint" id="hint">&#10022; 点击开启 &#10022;</div>
</div>

<script>
let isOpen = false;
let animating = false;
const envelope = document.getElementById('envelope');

envelope.addEventListener('click', function(e) {
  if (animating) return;
  animating = true;

  const flap   = document.getElementById('flap');
  const letter = document.getElementById('letter');
  const ribbon = document.getElementById('ribbon');
  const bow    = document.getElementById('bow');
  const hint   = document.getElementById('hint');

  if (!isOpen) {
    flap.classList.add('open');
    ribbon.classList.add('open');
    bow.classList.add('bow-loosen');

    setTimeout(() => {
      letter.classList.remove('closed');
      letter.classList.add('opened');
      animating = false;
    }, 750);

    hint.textContent = '✦ 点击关闭 ✦';
    isOpen = true;
    spawnSparks(e);

  } else {
    letter.classList.remove('opened');
    letter.classList.add('closed');

    setTimeout(() => {
      flap.classList.remove('open');
      ribbon.classList.remove('open');
      bow.classList.remove('bow-loosen');
      animating = false;
    }, 550);

    hint.textContent = '✦ 点击开启 ✦';
    isOpen = false;
  }
});

function spawnSparks(e) {
  const rect = document.getElementById('scene').getBoundingClientRect();
  const cx = rect.left + rect.width/2;
  const cy = rect.top + rect.height/2 - 30;
  for (let i = 0; i < 16; i++) {
    const s = document.createElement('div');
    s.className = 'spark';
    const angle = Math.random() * Math.PI * 2;
    const dist = 35 + Math.random() * 65;
    s.style.setProperty('--dx', Math.cos(angle) * dist + 'px');
    s.style.setProperty('--dy', Math.sin(angle) * dist - 35 + 'px');
    s.style.left = cx + 'px';
    s.style.top = cy + 'px';
    s.style.animationDuration = (0.7 + Math.random() * 0.9) + 's';
    s.style.width = (1.5 + Math.random() * 3) + 'px';
    s.style.height = s.style.width;
    document.body.appendChild(s);
    setTimeout(() => s.remove(), 1600);
  }
}
</script>
</body>
</html>
