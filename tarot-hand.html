<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>塔罗牌手势抽卡</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
  background:#0a0a0a;color:#e8edf2;
  font-family:'Cormorant Garamond','Noto Serif SC',serif;
  overflow:hidden;height:100vh;user-select:none;
  -webkit-font-smoothing:antialiased;
}
.hint{
  position:fixed;top:24px;left:32px;z-index:100;
  font-size:12px;color:rgba(255,255,255,.45);
  letter-spacing:.2em;font-weight:300;
  display:flex;align-items:center;gap:10px;
}
.hint-dot{width:7px;height:7px;border-radius:50%;background:#7ec8e3;transition:background .3s}
.top-actions{
  position:fixed;top:22px;right:32px;z-index:100;
  display:flex;gap:12px;
}
.top-btn{
  padding:7px 18px;border-radius:20px;font-size:11px;
  letter-spacing:.12em;font-weight:300;cursor:pointer;
  background:rgba(255,255,255,.04);color:rgba(255,255,255,.5);
  border:1px solid rgba(255,255,255,.08);transition:all .3s;
  font-family:inherit;
}
.top-btn:hover{background:rgba(255,255,255,.08);color:#fff;border-color:rgba(255,255,255,.15)}
.top-btn.active{background:rgba(126,200,227,.12);color:#7ec8e3;border-color:rgba(126,200,227,.3)}

/* 滚动视口 */
.viewport{
  width:100vw;height:100vh;overflow:hidden;
  display:flex;align-items:center;
}
.card-track{
  display:flex;gap:28px;padding:0 calc(50vw - 70px);
  transition:transform .6s cubic-bezier(.25,.8,.25,1.2);
  cursor:grab;
}
.card-track:active{cursor:grabbing}
.card-track.smooth{transition:transform .6s cubic-bezier(.25,.8,.25,1.2)}
.card-track.snap{transition:transform .4s cubic-bezier(.34,1.56,.64,1)}

/* 塔罗牌 */
.tarot-card{
  width:140px;height:210px;position:relative;flex-shrink:0;
  perspective:1000px;transition:transform .3s ease;
}
.tarot-card.highlight{transform:translateY(-8px) scale(1.05)}
.tarot-card-inner{
  width:100%;height:100%;position:relative;
  transform-style:preserve-3d;
  transition:transform .7s cubic-bezier(.4,0,.2,1);
}
.tarot-card.flipped .tarot-card-inner{transform:rotateY(180deg)}
.card-face{
  position:absolute;inset:0;border-radius:12px;
  backface-visibility:hidden;
  display:flex;align-items:center;justify-content:center;
  overflow:hidden;
}
.card-back{
  background:linear-gradient(145deg,#f5f2ed,#e8e4dc 40%,#ddd8ce);
  border:1.5px solid rgba(180,160,140,.3);
  box-shadow:0 8px 36px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.4);
  z-index:2;
}
.card-back-frame{
  position:absolute;inset:10px;border:1px solid rgba(160,140,120,.25);border-radius:6px;
}
.card-back-inner{
  position:absolute;inset:16px;border:.5px solid rgba(160,140,120,.12);border-radius:3px;
}
.card-back-pattern{
  position:absolute;inset:22px;
  background-image:
    radial-gradient(circle at 30% 30%,rgba(160,140,120,.15) 1px,transparent 1px),
    radial-gradient(circle at 70% 70%,rgba(160,140,120,.12) 1px,transparent 1px),
    radial-gradient(circle at 50% 50%,rgba(160,140,120,.08) 2px,transparent 2px);
  background-size:24px 24px,20px 20px,48px 48px;
}
.card-back-star{
  position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
  font-size:36px;opacity:.25;color:#b8956a;
}
.card-front{
  background:linear-gradient(180deg,#1a1520,#0d0a12);
  border:2px solid rgba(200,170,100,.25);
  box-shadow:0 8px 36px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.06);
  transform:rotateY(180deg);
  flex-direction:column;gap:10px;padding:20px 12px;
}
.card-front-icon{
  width:76px;height:76px;border-radius:50%;display:flex;align-items:center;
  justify-content:center;font-size:30px;border:1px solid rgba(200,170,100,.2);
  background:radial-gradient(circle at 40% 40%,rgba(200,170,100,.2),transparent 70%);
}
.card-front-name{
  font-size:14px;color:#d4c090;letter-spacing:.1em;
  font-family:'Noto Serif SC','Cormorant Garamond',serif;font-weight:300;
}
.card-front-keyword{
  font-size:10px;color:rgba(200,170,100,.5);letter-spacing:.15em;
}
.card-glow{
  position:absolute;inset:-6px;border-radius:16px;z-index:-1;
  opacity:0;transition:opacity .4s;
  box-shadow:0 0 30px rgba(126,200,227,.4),0 0 60px rgba(126,200,227,.15);
}
.tarot-card.highlight .card-glow{opacity:1}

/* 手势光标 */
.hand-cursor{
  position:fixed;pointer-events:none;z-index:80;
  width:44px;height:44px;border-radius:50%;
  border:2px solid rgba(126,200,227,.6);
  box-shadow:0 0 22px rgba(126,200,227,.35),inset 0 0 10px rgba(126,200,227,.1);
  transform:translate(-50%,-50%);display:none;transition:opacity .2s;
}
.hand-cursor::after{
  content:'';position:absolute;inset:6px;border-radius:50%;
  border:1px solid rgba(126,200,227,.25);
}
.hand-cursor.aiming{border-color:rgba(255,200,80,.7);box-shadow:0 0 26px rgba(255,200,80,.4),inset 0 0 12px rgba(255,200,80,.12)}
.skeleton-canvas{
  position:fixed;inset:0;z-index:75;pointer-events:none;
}

/* 粒子 */
.particle{
  position:fixed;pointer-events:none;z-index:90;
  border-radius:50%;
  animation:particleFly 1.5s ease-out forwards;
}
@keyframes particleFly{
  0%{opacity:1;transform:translate(0,0) scale(1)}
  100%{opacity:0;transform:translate(var(--dx),var(--dy)) scale(0)}
}

/* 结果弹窗 */
.result-overlay{
  position:fixed;inset:0;z-index:95;
  background:rgba(0,0,0,.7);backdrop-filter:blur(6px);
  display:flex;align-items:center;justify-content:center;
  animation:fadeIn .4s ease;
}
@keyframes fadeIn{from{opacity:0}}
.result-card{
  background:linear-gradient(180deg,#1a1520,#0d0a12);
  border:1.5px solid rgba(200,170,100,.25);border-radius:20px;
  padding:40px 36px;text-align:center;max-width:360px;width:90%;
  box-shadow:0 20px 60px rgba(0,0,0,.6);
  animation:slideUp .5s cubic-bezier(.34,1.56,.64,1);
}
@keyframes slideUp{from{transform:translateY(40px);opacity:0}}
.result-icon{font-size:48px;margin-bottom:12px}
.result-name{font-size:22px;color:#d4c090;letter-spacing:.12em;margin-bottom:6px;font-family:'Noto Serif SC',serif}
.result-keyword{font-size:13px;color:rgba(200,170,100,.5);letter-spacing:.15em;margin-bottom:16px}
.result-reading{font-size:13px;color:rgba(255,255,255,.55);line-height:1.8;letter-spacing:.05em;margin-bottom:20px}
.result-crystal{display:inline-flex;align-items:center;gap:8px;padding:10px 20px;border-radius:20px;background:rgba(200,170,100,.08);border:1px solid rgba(200,170,100,.15);font-size:12px;color:#d4c090;letter-spacing:.08em;margin-bottom:20px}
.result-btn{padding:10px 28px;border-radius:24px;font-size:12px;letter-spacing:.12em;cursor:pointer;background:rgba(200,170,100,.12);color:#d4c090;border:1px solid rgba(200,170,100,.2);transition:all .3s;font-family:inherit}
.result-btn:hover{background:rgba(200,170,100,.2);color:#fff}

/* 导航箭头 */
.nav-arrow{
  position:fixed;top:50%;transform:translateY(-50%);z-index:70;
  width:48px;height:48px;border-radius:50%;
  background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.1);
  color:rgba(255,255,255,.4);font-size:20px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  transition:all .3s;
}
.nav-arrow:hover{background:rgba(255,255,255,.1);color:#fff;border-color:rgba(255,255,255,.2)}
.nav-arrow.left{left:20px}.nav-arrow.right{right:20px}
</style>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400&family=Noto+Serif+SC:wght@300;400&display=swap" rel="stylesheet">
</head>
<body>

<div class="hint">
  <span class="hint-dot" id="hintDot"></span>
  <span id="hintText">等待摄像头...</span>
</div>

<div class="top-actions">
  <button class="top-btn active" id="gestureBtn" onclick="toggleGesture()">✋ 手势模式</button>
  <button class="top-btn" onclick="resetAll()">🔄 重新抽卡</button>
</div>

<canvas class="skeleton-canvas" id="skeletonCanvas"></canvas>
<div class="hand-cursor" id="handCursor"></div>

<button class="nav-arrow left" onclick="scrollBy(-1)">‹</button>
<button class="nav-arrow right" onclick="scrollBy(1)">›</button>

<div class="viewport" id="viewport">
  <div class="card-track smooth" id="cardTrack"></div>
</div>

<script src="mediapipe/hands.js"></script>
<script src="mediapipe/camera_utils.js"></script>

<script>
const tarotData = [
  { id:'sun',name:'太阳',keyword:'光明与喜悦',icon:'☀️',reading:'今天是充满能量的一天。太阳牌预示成功与幸福，你的努力即将得到回报，勇敢表达自己。',crystal:'黄水晶',reason:'招财纳福',color:'#f5d442' },
  { id:'moon',name:'月亮',keyword:'直觉与梦境',icon:'🌙',reading:'相信你的直觉。月亮牌提醒你倾听内心的声音，有些答案不在表面，需要向内探索。',crystal:'月光石',reason:'平衡情绪',color:'#b8c5ff' },
  { id:'star',name:'星星',keyword:'希望与灵感',icon:'⭐',reading:'保持希望。星星牌代表灵感与疗愈，今天的你格外有创造力，大胆追随心中所想。',crystal:'紫水晶',reason:'开启智慧',color:'#9b59b6' },
  { id:'lovers',name:'恋人',keyword:'选择与和谐',icon:'💕',reading:'重要的选择即将到来。恋人牌象征关系与和谐，跟随内心做出决定，平衡理性与感性。',crystal:'粉水晶',reason:'增进人缘',color:'#f8c8d8' },
  { id:'magician',name:'魔术师',keyword:'创造与力量',icon:'🔮',reading:'你拥有实现一切的能力。魔术师代表创造力与行动力，今天适合开启新计划。',crystal:'黑曜石',reason:'破除障碍',color:'#2c3a4a' },
  { id:'empress',name:'女皇',keyword:'丰饶与滋养',icon:'👑',reading:'丰盛正在靠近。女皇牌象征收获与滋养，今天适合享受生活、犒赏自己。',crystal:'绿幽灵',reason:'招正财',color:'#4a9c5d' },
  { id:'chariot',name:'战车',keyword:'胜利与前进',icon:'⚔️',reading:'勇往直前。战车牌代表决心与胜利，今天没有跨不过的坎。',crystal:'虎眼石',reason:'增强定力',color:'#b8860b' },
  { id:'hermit',name:'隐士',keyword:'内省与智慧',icon:'🏔️',reading:'向内探索的一天。隐士牌提醒你暂时远离喧嚣，在独处中找到答案。',crystal:'白水晶',reason:'净化杂念',color:'#e8edf2' },
  { id:'fortune',name:'命运之轮',keyword:'转机与机遇',icon:'🎡',reading:'命运的齿轮正在转动。保持开放心态，计划之外的好事正在路上。',crystal:'橄榄石',reason:'吸引好运',color:'#9acd32' },
  { id:'justice',name:'正义',keyword:'公平与真相',icon:'⚖️',reading:'真相即将大白。正义牌代表公平与平衡，今天做出的判断将影响深远。',crystal:'海蓝宝',reason:'顺畅表达',color:'#5dade2' },
];

// DOM
const track = document.getElementById('cardTrack');
const viewport = document.getElementById('viewport');
const handCursor = document.getElementById('handCursor');
const skeletonCanvas = document.getElementById('skeletonCanvas');
const skCtx = skeletonCanvas.getContext('2d');
const hintText = document.getElementById('hintText');
const hintDot = document.getElementById('hintDot');
const gestureBtn = document.getElementById('gestureBtn');

// State
let gestureEnabled = true;
let currentIndex = 0;
let handPos = null;
let handLandmarks = null;
let hoveredCard = null;
let hoverTimer = null;
let flippedCards = new Set();
let isDragging = false;
let dragStartX = 0;
let trackStartX = 0;

// 创建卡牌
tarotData.forEach((d,i) => {
  const card = document.createElement('div');
  card.className = 'tarot-card';card.dataset.index = i;
  card.innerHTML = `
    <div class="card-glow"></div>
    <div class="tarot-card-inner">
      <div class="card-face card-back">
        <div class="card-back-frame"></div><div class="card-back-inner"></div>
        <div class="card-back-pattern"></div><div class="card-back-star">✦</div>
      </div>
      <div class="card-face card-front">
        <div class="card-front-icon" style="background:radial-gradient(circle at 40% 40%,${d.color}30,transparent 70%)">${d.icon}</div>
        <div class="card-front-name">${d.name}</div>
        <div class="card-front-keyword">${d.keyword}</div>
      </div>
    </div>
  `;
  track.appendChild(card);
});
const cards = () => document.querySelectorAll('.tarot-card');

function scrollTo(index, snap) {
  currentIndex = Math.max(0, Math.min(tarotData.length - 1, index));
  const card = cards()[currentIndex];
  if (!card) return;
  const cardRect = card.getBoundingClientRect();
  const viewRect = viewport.getBoundingClientRect();
  const offset = cardRect.left - viewRect.left - viewRect.width / 2 + cardRect.width / 2;
  track.classList.remove('smooth','snap');
  track.classList.add(snap?'snap':'smooth');
  track.style.transform = `translateX(${-offset}px)`;
}

function scrollBy(dir) {
  scrollTo(currentIndex + dir, true);
}

// 拖拽滚动
track.addEventListener('mousedown', e => {
  if (document.querySelector('.result-overlay')) return;
  isDragging = true;dragStartX = e.clientX;
  trackStartX = track.style.transform?parseFloat(track.style.transform.replace('translateX(','').replace('px)','')):0;
  track.classList.remove('smooth','snap');
});
window.addEventListener('mousemove', e => {
  if (!isDragging) return;
  const dx = e.clientX - dragStartX;
  track.style.transform = `translateX(${trackStartX + dx}px)`;
});
window.addEventListener('mouseup', () => {
  if (!isDragging) return;isDragging = false;
  // 吸附到最近的卡片
  const viewRect = viewport.getBoundingClientRect();
  const viewCenter = viewRect.left + viewRect.width / 2;
  let closest = 0, minDist = Infinity;
  cards().forEach((c,i) => {
    const r = c.getBoundingClientRect();
    const dist = Math.abs(r.left + r.width/2 - viewCenter);
    if (dist < minDist) { minDist = dist; closest = i; }
  });
  scrollTo(closest, true);
});

// 选择卡牌
function selectCard(index) {
  if (flippedCards.has(index)) return;
  flippedCards.add(index);
  const card = cards()[index];
  if (!card) return;
  card.classList.add('flipped');
  card.classList.remove('highlight');
  const rect = card.getBoundingClientRect();
  spawnParticles(rect.left + rect.width/2, rect.top + rect.height/2);
  setTimeout(() => showResult(index), 800);
}

function showResult(index) {
  const d = tarotData[index];
  const overlay = document.createElement('div');
  overlay.className = 'result-overlay';
  overlay.innerHTML = `
    <div class="result-card">
      <div class="result-icon">${d.icon}</div>
      <div class="result-name">${d.name}</div>
      <div class="result-keyword">${d.keyword}</div>
      <div class="result-reading">${d.reading}</div>
      <div class="result-crystal">💎 ${d.crystal} · ${d.reason}</div><br>
      <button class="result-btn" onclick="this.closest('.result-overlay').remove();resetAll()">重新抽卡</button>
    </div>
  `;
  overlay.addEventListener('click', function(e) {
    if (e.target === overlay) { overlay.remove(); resetAll(); }
  });
  document.body.appendChild(overlay);
}

function resetAll() {
  flippedCards.clear();
  cards().forEach(c => { c.classList.remove('flipped', 'highlight'); });
  hoveredCard = null;
  if (hoverTimer) clearTimeout(hoverTimer);
}

function spawnParticles(x, y, count = 30) {
  for (let i = 0; i < count; i++) {
    const p = document.createElement('div');
    p.className = 'particle';
    const angle = Math.random() * Math.PI * 2;
    const dist = 40 + Math.random() * 80;
    p.style.cssText = `
      left:${x}px;top:${y}px;width:${2+Math.random()*4}px;height:${2+Math.random()*4}px;
      background:${Math.random()>.5?'#e8d5a0':'#d4c090'};
      --dx:${Math.cos(angle)*dist}px;--dy:${Math.sin(angle)*dist-30}px;
      animation-duration:${1+Math.random()*.8}s;
      box-shadow:0 0 ${4+Math.random()*6}px rgba(232,213,160,.6);
    `;
    document.body.appendChild(p);
    setTimeout(() => p.remove(), 2000);
  }
}

// 手势光标悬停检测（鼠标降级）
document.addEventListener('mousemove', e => {
  if (gestureEnabled) return; // 手势模式时不用鼠标
  if (isDragging) return;
  handCursor.style.left = e.clientX + 'px';
  handCursor.style.top = e.clientY + 'px';
  handCursor.style.display = 'block';
  checkHover(e.clientX, e.clientY);
});

function checkHover(x, y) {
  if (isDragging) return;
  let found = null;
  cards().forEach((c, i) => {
    if (flippedCards.has(i)) return;
    const r = c.getBoundingClientRect();
    if (x >= r.left && x <= r.right && y >= r.top && y <= r.bottom) found = { el: c, index: i };
  });
  if (found) {
    if (hoveredCard !== found.index) {
      if (hoveredCard !== null) cards()[hoveredCard]?.classList.remove('highlight');
      hoveredCard = found.index;
      found.el.classList.add('highlight');
      hintText.textContent = '悬停中...';
      hintDot.style.background = '#f59e0b';
      if (hoverTimer) clearTimeout(hoverTimer);
      hoverTimer = setTimeout(() => selectCard(found.index), 1000);
    }
  } else {
    if (hoveredCard !== null) {
      cards()[hoveredCard]?.classList.remove('highlight');
      hoveredCard = null;
      hintText.textContent = gestureEnabled ? '手势追踪中...' : '拖拽或悬停卡牌';
      hintDot.style.background = '#7ec8e3';
    }
    if (hoverTimer) { clearTimeout(hoverTimer); hoverTimer = null; }
  }
}

// ====== MediaPipe Hands ======
let hands = null, camera = null;

async function initMediaPipe() {
  try {
    hands = new Hands({
      locateFile: file => `mediapipe/${file}`
    });
    hands.setOptions({
      maxNumHands: 1, modelComplexity: 0,
      minDetectionConfidence: 0.5, minTrackingConfidence: 0.3
    });
    hands.onResults(onHandResults);

    const video = document.createElement('video');
    video.setAttribute('playsinline', '');
    video.setAttribute('muted', '');
    video.style.display = 'none';
    document.body.appendChild(video);

    camera = new Camera(video, {
      onFrame: async () => {
        if (hands && video.readyState >= 2) await hands.send({ image: video });
      },
      width: 640, height: 480
    });
    await camera.start();
    hintText.textContent = '手势已就绪 · 移动手掌选牌';
    hintDot.style.background = '#4ade80';
  } catch (e) {
    console.warn('摄像头不可用:', e.message);
    gestureEnabled = false;
    gestureBtn.classList.remove('active');
    gestureBtn.textContent = '🖱 鼠标模式';
    hintText.textContent = '摄像头不可用 · 鼠标模式';
    hintDot.style.background = '#f59e0b';
  }
}

function onHandResults(results) {
  if (!results.multiHandLandmarks || results.multiHandLandmarks.length === 0 || !gestureEnabled) {
    handLandmarks = null;
    handCursor.style.display = 'none';
    return;
  }

  const lm = results.multiHandLandmarks[0];
  const w = skeletonCanvas.width, h = skeletonCanvas.height;
  handLandmarks = lm.map(p => ({ x: (1 - p.x) * w, y: p.y * h }));

  const tip = handLandmarks[8];
  handPos = { x: tip.x, y: tip.y };
  handCursor.style.left = tip.x + 'px';
  handCursor.style.top = tip.y + 'px';
  handCursor.style.display = 'block';
  if (isDragging) return;
  checkHover(tip.x, tip.y);

  // 挥手检测(左右快速移动=翻页)
  const wrist = handLandmarks[0];
  if (!handCursor._lastWristX) handCursor._lastWristX = wrist.x;
  const dx = wrist.x - (handCursor._lastWristX || wrist.x);
  handCursor._lastWristX = wrist.x;
  if (!handCursor._moveHistory) handCursor._moveHistory = [];
  handCursor._moveHistory.push({ dx, t: Date.now() });
  if (handCursor._moveHistory.length > 20) handCursor._moveHistory.shift();
  const recent = handCursor._moveHistory.filter(m => Date.now() - m.t < 500);
  const totalDx = recent.reduce((s, m) => s + m.dx, 0);
  if (Math.abs(totalDx) > 120 && Date.now() - (handCursor._lastScroll||0) > 1200) {
    handCursor._lastScroll = Date.now();
    scrollBy(totalDx > 0 ? -1 : 1);
  }

  drawSkeleton();
}

function drawSkeleton() {
  skCtx.clearRect(0, 0, skeletonCanvas.width, skeletonCanvas.height);
  if (!handLandmarks || !gestureEnabled) return;
  const conns = [
    [0,1],[1,2],[2,3],[3,4],[0,5],[5,6],[6,7],[7,8],
    [0,9],[9,10],[10,11],[11,12],[0,13],[13,14],[14,15],[15,16],
    [0,17],[17,18],[18,19],[19,20],[5,9],[9,13],[13,17]
  ];
  skCtx.strokeStyle = 'rgba(126,200,227,.25)';skCtx.lineWidth = 1.5;
  skCtx.beginPath();
  conns.forEach(([a,b]) => {
    skCtx.moveTo(handLandmarks[a].x, handLandmarks[a].y);
    skCtx.lineTo(handLandmarks[b].x, handLandmarks[b].y);
  });
  skCtx.stroke();
  handLandmarks.forEach((p, i) => {
    skCtx.beginPath();
    skCtx.arc(p.x, p.y, i === 8 ? 5 : 3, 0, Math.PI * 2);
    skCtx.fillStyle = i === 8 ? 'rgba(126,200,227,.6)' : 'rgba(126,200,227,.3)';
    skCtx.fill();
  });
}

function toggleGesture() {
  gestureEnabled = !gestureEnabled;
  gestureBtn.textContent = gestureEnabled ? '✋ 手势模式' : '🖱 鼠标模式';
  gestureBtn.classList.toggle('active', gestureEnabled);
  hintText.textContent = gestureEnabled ? '手势追踪中...' : '拖拽或悬停卡牌';
  hintDot.style.background = gestureEnabled ? '#4ade80' : '#7ec8e3';
  if (!gestureEnabled) { handCursor.style.display = 'none'; }
}

// Resize
function resize() {
  skeletonCanvas.width = window.innerWidth;
  skeletonCanvas.height = window.innerHeight;
  scrollTo(currentIndex, false);
}
window.addEventListener('resize', resize);
resize();

// Start
initMediaPipe();
requestAnimationFrame(function loop() {
  if (handLandmarks && gestureEnabled && !isDragging) drawSkeleton();
  requestAnimationFrame(loop);
});
</script>
</body>
</html>
